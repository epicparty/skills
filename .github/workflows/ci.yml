name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and check the pack
        run: node bin/cli.mjs build --prefix acme --out "$RUNNER_TEMP/acme"
      - name: Every changed skill is named by a changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: node scripts/version-skills.mjs --check "origin/${{ github.base_ref }}"
